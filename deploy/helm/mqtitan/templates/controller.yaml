apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: "{{ .Release.Name }}", component: controller}
  template:
    metadata:
      labels: {app: "{{ .Release.Name }}", component: controller}
      {{- with .Values.controller.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--listen", "0.0.0.0:8080", "--data", "/data/mqtitan.db", "--web", "/app/web/dist"]
          env:
            - name: MQTITAN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.existingSecret is required" .Values.auth.existingSecret }}
                  key: {{ .Values.auth.key }}
            {{- if .Values.auth.workerKey }}
            - name: MQTITAN_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.workerKey }}
            {{- end }}
            {{- with .Values.auth.oidc }}
            {{- if .enabled }}
            - {name: MQTITAN_OIDC_ISSUER, value: {{ required "auth.oidc.issuer is required" .issuer | quote }}}
            - {name: MQTITAN_OIDC_CLIENT_ID, value: {{ required "auth.oidc.clientId is required" .clientId | quote }}}
            - {name: MQTITAN_OIDC_REDIRECT_URL, value: {{ .redirectUrl | default (printf "https://%s/auth/callback" $.Values.ingress.host) | quote }}}
            {{- if .postLogoutRedirectUrl }}
            - {name: MQTITAN_OIDC_POST_LOGOUT_REDIRECT_URL, value: {{ .postLogoutRedirectUrl | quote }}}
            {{- end }}
            {{- if .scopes }}
            - {name: MQTITAN_OIDC_SCOPES, value: {{ join "," .scopes | quote }}}
            {{- end }}
            {{- if .audiences }}
            - {name: MQTITAN_OIDC_AUDIENCES, value: {{ join "," .audiences | quote }}}
            {{- end }}
            {{- if .allowedGroups }}
            - {name: MQTITAN_OIDC_ALLOWED_GROUPS, value: {{ join "," .allowedGroups | quote }}}
            {{- end }}
            {{- if .groupsClaim }}
            - {name: MQTITAN_OIDC_GROUPS_CLAIM, value: {{ .groupsClaim | quote }}}
            {{- end }}
            {{- if .usernameClaim }}
            - {name: MQTITAN_OIDC_USERNAME_CLAIM, value: {{ .usernameClaim | quote }}}
            {{- end }}
            {{- if .sessionTTL }}
            - {name: MQTITAN_OIDC_SESSION_TTL, value: {{ .sessionTTL | quote }}}
            {{- end }}
            {{- if .existingSecret }}
            - name: MQTITAN_OIDC_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ .existingSecret }}, key: {{ .clientSecretKey }}, optional: true}}
            - name: MQTITAN_OIDC_COOKIE_SECRET
              valueFrom: {secretKeyRef: {name: {{ .existingSecret }}, key: {{ .cookieSecretKey }}, optional: true}}
            {{- end }}
            {{- if .caConfigMap }}
            - {name: MQTITAN_OIDC_CA_FILE, value: /etc/mqtitan/oidc-ca/ca.crt}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports: [{name: http, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            {{- if and .Values.auth.oidc.enabled .Values.auth.oidc.caConfigMap }}
            - {name: oidc-ca, mountPath: /etc/mqtitan/oidc-ca, readOnly: true}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.auth.oidc.enabled .Values.auth.oidc.caConfigMap }}
        - name: oidc-ca
          configMap: {name: {{ .Values.auth.oidc.caConfigMap }}}
        {{- end }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: "{{ .Release.Name }}"}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {app: "{{ .Release.Name }}", component: controller}
spec:
  selector: {app: "{{ .Release.Name }}", component: controller}
  ports: [{name: http, port: 8080, targetPort: http}]
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}

