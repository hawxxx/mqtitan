image:
  repository: mqtitan
  tag: "0.1.0"
  pullPolicy: IfNotPresent
auth:
  existingSecret: mqtitan-auth
  key: token
controller:
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "2", memory: 2Gi}
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
worker:
  replicas: 0
  resources:
    requests: {cpu: "1", memory: 1Gi}
    limits: {cpu: "4", memory: 8Gi}
  nodeSelector: {}
  affinity: {}
  topologySpreadConstraints: []
ingress:
  enabled: false
  className: ""
  host: mqtitan.example.com
  tlsSecret: ""
serviceMonitor:
  enabled: false
pdb:
  enabled: true
networkPolicy:
  enabled: true
  # Broker addresses/ports must be explicitly allowed for worker load traffic.
  brokerEgress: []

