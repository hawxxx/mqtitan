image:
  repository: ghcr.io/hawxxx/mqtitan
  tag: ""          # defaults to Chart appVersion
  digest: ""       # e.g. sha256:...; overrides tag for immutable deploys
  pullPolicy: IfNotPresent
auth:
  existingSecret: mqtitan-auth
  key: token
  # Optional key in the same Secret holding a separate worker token. When set,
  # workers receive only this token and it is only accepted on worker routes.
  workerKey: ""
  # OpenID Connect sign-in (authentik, Keycloak, Entra ID, Okta, Dex, ...).
  # See docs/authentication.md. The bearer token above keeps working for CLI
  # and automation alongside OIDC.
  oidc:
    enabled: false
    issuer: ""             # e.g. https://authentik.example.com/application/o/mqtitan/
    clientId: ""
    # Public callback URL; defaults to https://<ingress.host>/auth/callback.
    redirectUrl: ""
    postLogoutRedirectUrl: ""
    scopes: []             # default: openid, profile, email
    audiences: []          # extra accepted bearer-token audiences
    allowedGroups: []      # empty: any user the IdP lets through
    groupsClaim: ""        # default: groups
    usernameClaim: ""      # default: preferred_username
    sessionTTL: ""         # default: 8h
    # Secret with the client secret and a cookie secret (>= 32 characters)
    # so sessions survive controller restarts. Missing keys are skipped.
    existingSecret: ""
    clientSecretKey: client-secret
    cookieSecretKey: cookie-secret
    # ConfigMap holding ca.crt for an identity provider behind a private CA.
    caConfigMap: ""
    # NetworkPolicy egress rules that let the controller reach the IdP.
    egress: []
controller:
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "2", memory: 2Gi}
  # Extra container env entries, e.g. MQTITAN_OIDC_ISSUER or secretKeyRef-backed values.
  extraEnv: []
  hostAliases: []
  dnsConfig: {}
  # Scheduling, rendered only when set. Example: keep the controller off spot nodes with
  # nodeSelector {karpenter.sh/capacity-type: on-demand}.
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # Pod annotations, rendered only when set. Example: {karpenter.sh/do-not-disrupt: "true"}.
  podAnnotations: {}
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
worker:
  replicas: 0
  resources:
    requests: {cpu: "1", memory: 1Gi}
    limits: {cpu: "4", memory: 8Gi}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # Pod annotations, rendered only when set. Example: {karpenter.sh/do-not-disrupt: "true"}.
  podAnnotations: {}
  topologySpreadConstraints: []
  hostAliases: []
  dnsConfig: {}
  # Namespaced sysctls, e.g. widen the ephemeral port range (safe sysctl on Kubernetes 1.27+).
  sysctls: []
ingress:
  enabled: false
  className: ""
  host: mqtitan.example.com
  tlsSecret: ""
serviceMonitor:
  enabled: false
pdb:
  enabled: true
networkPolicy:
  enabled: true
  # Broker addresses/ports must be explicitly allowed for worker load traffic.
  brokerEgress: []

