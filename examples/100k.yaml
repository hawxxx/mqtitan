apiVersion: mqtitan.io/v1alpha1
kind: Scenario
name: 100k-telemetry
broker:
  url: mqtt://localhost:1883
  version: "3.1.1"
  connectTimeout: 10s
  keepAlive: 30s
  cleanStart: true
clients:
  count: 100000
  idTemplate: 100k-${sequence:08}
stages:
  - duration: 5m
    targetClients: 100000
workloads:
  - name: telemetry
    type: publisher
    clients: 100000
    topic: devices/${clientId}/telemetry
    qos: 0
    ratePerClient: 1
    payload:
      type: static
      value: '{"source":"mqtitan"}'
thresholds:
  connection_error_rate: "<1%"
  publish_error_rate: "<0.1%"

