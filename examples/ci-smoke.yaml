apiVersion: mqtitan.io/v1alpha1
kind: Scenario
name: ci-smoke-telemetry
broker:
  url: mqtt://localhost:1883
  version: "3.1.1"
  connectTimeout: 10s
  keepAlive: 30s
  cleanStart: true
clients:
  count: 20
  idTemplate: ci-smoke-${sequence:08}
stages:
  - duration: 3s
    targetClients: 20
workloads:
  - name: telemetry
    type: publisher
    clients: 20
    topic: devices/${clientId}/telemetry
    qos: 1
    ratePerClient: 1
    payload:
      type: static
      value: '{"source":"mqtitan"}'
thresholds:
  connection_error_rate: "<1%"
  publish_error_rate: "<0.1%"

