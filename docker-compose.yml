services:
  controller:
    build: .
    # Published image: MQTITAN_IMAGE=ghcr.io/hawxxx/mqtitan:1.2.3 docker compose pull
    image: ${MQTITAN_IMAGE:-mqtitan:local}
    environment:
      MQTITAN_TOKEN: ${MQTITAN_TOKEN:?Set MQTITAN_TOKEN to a random bearer token}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - controller-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
  broker:
    image: emqx/emqx:5.8.8
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:18083:18083"
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?Set EMQX_DASHBOARD_PASSWORD}
    volumes:
      - broker-data:/opt/emqx/data
    restart: unless-stopped
  worker:
    image: ${MQTITAN_IMAGE:-mqtitan:local}
    profiles: [workers]
    command: ["worker", "--controller", "http://controller:8080", "--id", "compose-worker-1"]
    environment:
      MQTITAN_TOKEN: ${MQTITAN_TOKEN:?Set MQTITAN_TOKEN}
    depends_on:
      controller:
        condition: service_healthy
      broker:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    restart: unless-stopped
volumes:
  controller-data:
  broker-data:

